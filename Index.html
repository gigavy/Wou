  }
  a{color:inherit;text-decoration:none;}
  .wrap{max-width:820px;margin:0 auto;padding:0 28px;}
  a:focus-visible, button:focus-visible{outline:2px solid var(--ink);outline-offset:3px;}
  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.001ms !important; animation-iteration-count:1 !important; transition-duration:0.001ms !important;}
  }

  /* ---------- NAV ---------- */
  nav{
    position:sticky;top:0;z-index:50;
    background:rgba(246,245,240,0.9);
    backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line-strong);
  }
  nav .wrap{display:flex;align-items:center;justify-content:space-between;height:60px;}
  .brand{display:flex;align-items:center;gap:10px;}
  .brand img{width:26px;height:26px;border-radius:6px;object-fit:cover;}
  .brand span{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:16px;letter-spacing:-0.01em;}
  .navlinks{display:flex;align-items:center;gap:26px;}
  .navlinks a{
    font-size:13px;color:var(--ink-soft);
    padding-bottom:2px;border-bottom:1px solid transparent;
    transition:border-color 0.15s ease;
  }
  .navlinks a:hover{border-color:var(--ink);}
  .navlinks a.dl{font-weight:600;}

  /* ---------- HERO ---------- */
  .hero{padding:56px 0 0;}
  .hero .kicker{
    font-family:'JetBrains Mono',monospace;font-size:11.5px;letter-spacing:0.08em;
    text-transform:uppercase;color:var(--muted);margin-bottom:18px;
  }
  .hero-top{display:flex;align-items:flex-start;gap:22px;margin-bottom:26px;}
  .hero-icon{
    width:72px;height:72px;border-radius:16px;object-fit:cover;
    border:1px solid var(--line-strong);flex-shrink:0;
  }
  h1.wordmark{
    font-family:'Space Grotesk',sans-serif;font-weight:700;
    font-size:clamp(52px,9vw,88px);
    line-height:0.9;letter-spacing:-0.03em;
  }
  .tagline{
    font-size:clamp(18px,2.4vw,22px);
    line-height:1.4;
    color:var(--ink-soft);
    max-width:480px;
    margin-bottom:26px;
  }
  .meta-row{
    display:flex;flex-wrap:wrap;align-items:center;gap:0;
    font-family:'JetBrains Mono',monospace;font-size:12.5px;color:var(--muted);
    padding:16px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);
    margin-bottom:28px;
  }
  .meta-row span{padding:0 14px;position:relative;}
  .meta-row span:first-child{padding-left:0;}
  .meta-row span + span::before{
    content:'';position:absolute;left:0;top:2px;bottom:2px;width:1px;background:var(--line);
  }
  .meta-row b{color:var(--ink);font-weight:500;}

  /* ---------- DOWNLOAD BAR ---------- */
  .dl-bar{
    display:flex;align-items:center;justify-content:space-between;gap:16px;
    background:#17A34A;color:#f6f5f0;
    padding:22px 26px;border-radius:2px;
    transition:transform 0.12s ease, background 0.15s ease;
  }
  .dl-bar:hover{transform:translateX(2px);background:#149140;}
  .dl-bar .dl-left b{
    font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:17px;display:block;
  }
  .dl-bar .dl-left span{
    font-family:'JetBrains Mono',monospace;font-size:11.5px;opacity:0.65;
  }
  .dl-bar .dl-arrow{
    font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:15px;
    white-space:nowrap;
  }
  .dl-note{
    font-size:12px;color:var(--muted);margin-top:12px;
  }

  /* ---------- ABOUT DEV ROW ---------- */
  .dev-row{
    border-top:1px solid var(--line);border-bottom:1px solid var(--line);
    margin-top:52px;
  }
  .dev-inner{
    display:flex;align-items:center;gap:14px;padding:16px 0;
  }
  .dev-avatar{
    width:34px;height:34px;border-radius:50%;object-fit:cover;
    border:1px solid var(--line-strong);flex-shrink:0;
  }
  .dev-label{
    font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:0.07em;
    text-transform:uppercase;color:var(--muted);margin-right:4px;
  }
  .dev-name{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:14px;}
  .dev-gh{
    font-size:13px;color:var(--muted);
    border-bottom:1px solid transparent;
    transition:border-color 0.15s ease, color 0.15s ease;
  }
  .dev-gh:hover{color:var(--ink);border-color:var(--ink);}

  /* ---------- SECTIONS ---------- */
  .section{padding:56px 0;}
  .section-title{
    font-family:'Space Grotesk',sans-serif;font-weight:700;
    font-size:clamp(30px,4.4vw,42px);letter-spacing:-0.02em;
    margin-bottom:32px;
  }

  /* ---------- PREVIEW ---------- */
  .preview-row{
    display:flex;flex-wrap:nowrap;gap:20px;
    overflow-x:auto;padding-bottom:6px;
    -webkit-overflow-scrolling:touch;
  }
  .shot{flex:0 0 auto;width:118px;cursor:zoom-in;}
  .shot .num{
    font-family:'JetBrains Mono',monospace;font-size:10.5px;color:var(--muted);
    margin-bottom:8px;display:block;
  }
  .shot-frame{
    border:1px solid var(--line-strong);
    aspect-ratio:9/19.5;overflow:hidden;background:#000;
  }
  .shot-frame img{width:100%;height:100%;object-fit:cover;display:block;transition:transform 0.3s ease;}
  .shot:hover .shot-frame img{transform:scale(1.05);}
  .shot .name{
    font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:12.5px;
    margin-top:8px;display:block;
  }

  /* ---------- LIGHTBOX ---------- */
  .lightbox{
    position:fixed;inset:0;z-index:200;
    background:rgba(10,10,9,0.95);
    display:flex;align-items:center;justify-content:center;
    padding:32px;
    opacity:0;pointer-events:none;
    transition:opacity 0.2s ease;
  }
  .lightbox.open{opacity:1;pointer-events:auto;}
  .lightbox img{
    max-width:min(88vw, 420px);max-height:86vh;
    border:1px solid rgba(255,255,255,0.2);
    cursor:zoom-out;
  }
  .lightbox-close{
    position:absolute;top:24px;right:28px;
    width:38px;height:38px;
    border:1px solid rgba(255,255,255,0.3);
    display:flex;align-items:center;justify-content:center;
    color:#f6f5f0;cursor:pointer;
    font-family:'Space Grotesk',sans-serif;font-size:14px;
  }

  /* ---------- ABOUT APP (FEATURE LIST) ---------- */
  .feat-list{border-top:1px solid var(--line-strong);}
  .feat{
    display:flex;gap:24px;align-items:baseline;
    padding:22px 0;border-bottom:1px solid var(--line);
  }
  .feat .fnum{
    font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--muted);
    flex-shrink:0;width:26px;
  }
  .feat .ftitle{
    font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:16px;
    flex-shrink:0;width:170px;
  }
  .feat .fdesc{color:var(--ink-soft);font-size:14px;line-height:1.5;}

  /* ---------- FOOTER ---------- */
  footer{border-top:1px solid var(--line-strong);padding:28px 0;}
  footer .wrap{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;}
  .footer-brand{display:flex;align-items:center;gap:8px;}
  .footer-brand img{width:20px;height:20px;border-radius:5px;object-fit:cover;}
  .footer-brand span{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:13px;}
  footer .credit{font-size:12.5px;color:var(--muted);}
  footer .credit a{border-bottom:1px solid var(--line);color:var(--ink-soft);}

  /* ---------- RESPONSIVE ---------- */
  @media (max-width:640px){
    .navlinks{gap:16px;}
    .hero-top{gap:14px;}
    .hero-icon{width:56px;height:56px;border-radius:12px;}
    .feat{flex-direction:column;gap:6px;}
    .feat .ftitle{width:auto;}
    .dl-bar{flex-direction:column;align-items:flex-start;gap:14px;}
  }
  @media (max-width:420px){
    .wrap{padding:0 20px;}
    .shot{width:96px;}
  }
</style>
</head>
